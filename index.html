<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- ================================================================
       MAIN CONTENT
       ================================================================ -->
  <main class="main-content">

    <!-- ================================================================
         HEADER — greeting on the left
         ================================================================ -->
    <header>
    <div class="header-left">
      <!-- "Good afternoon" — written by getGreeting() in app.js -->
      <h1 id="greeting"></h1>
      <!-- "Friday, April 4, 2026" — written by getDateDisplay() in app.js -->
      <div class="date" id="dateDisplay"></div>
    </div>
    
    <!-- Search component -->
    <div class="header-right">
      <div class="search-container" id="searchContainer">
        <button class="appearance-toggle" id="appearanceToggle" title="外观" aria-label="打开外观设置" aria-expanded="false" aria-controls="appearancePanel">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.098 19.902a3.75 3.75 0 0 0 5.304 0l6.401-6.402M6.75 21A3.75 3.75 0 0 1 3 17.25V4.125C3 3.504 3.504 3 4.125 3h5.25c.621 0 1.125.504 1.125 1.125v4.072M6.75 21a3.75 3.75 0 0 0 3.75-3.75V8.197M6.75 21h13.125c.621 0 1.125-.504 1.125-1.125v-5.25c0-.621-.504-1.125-1.125-1.125h-4.072M10.5 8.197l2.88-2.88a1.125 1.125 0 0 1 1.591 0l3.712 3.712a1.125 1.125 0 0 1 0 1.591l-2.88 2.88M6.75 17.25h.008v.008H6.75v-.008Z" />
          </svg>
        </button>
        <button class="search-toggle" id="searchToggle" title="搜索" aria-label="搜索标签页和书签" aria-expanded="false" aria-controls="searchBox">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
        <div class="search-box" id="searchBox" role="search">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜索标签页和书签…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="searchResults"
            aria-expanded="false"
          />
          <button class="search-clear" id="searchClear" style="display:none" aria-label="清除搜索">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="search-results" id="searchResults" role="listbox"></div>
        <div class="appearance-panel" id="appearancePanel" aria-label="外观设置" hidden>
          <div class="appearance-heading">
            <div>
              <strong>外观</strong>
              <span>自定义你的空间</span>
            </div>
          </div>
          <div class="appearance-row">
            <button class="appearance-btn" id="chooseBackgroundBtn">选择图片</button>
            <button class="appearance-btn subtle" id="clearBackgroundBtn">清除</button>
            <input type="file" id="backgroundImageInput" accept="image/*" hidden>
          </div>
          <label class="appearance-range">
            <span>遮罩</span>
            <input type="range" id="backgroundMaskRange" min="10" max="85" step="5">
            <strong id="backgroundMaskValue">45%</strong>
          </label>
          <label class="appearance-switch">
            <span>
              <strong>效果</strong>
              <small>鼠标轨迹、动效和声音</small>
            </span>
            <input type="checkbox" id="effectsToggle" role="switch" checked>
          </label>
          <label class="appearance-switch language-control">
            <span><strong>语言</strong></span>
            <select id="languageSelect" aria-label="语言">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <div class="palette-row" id="paletteRow" aria-label="配色">
            <button class="palette-swatch active" data-palette="forest" title="森林" aria-label="森林配色"></button>
            <button class="palette-swatch slate" data-palette="slate" title="石板" aria-label="石板配色"></button>
            <button class="palette-swatch dusk" data-palette="dusk" title="暮色" aria-label="暮色配色"></button>
            <button class="palette-swatch ocean" data-palette="ocean" title="海洋" aria-label="海洋配色"></button>
            <button class="palette-swatch plum" data-palette="plum" title="梅紫" aria-label="梅紫配色"></button>
            <button class="palette-swatch graphite" data-palette="graphite" title="石墨" aria-label="石墨配色"></button>
            <button class="palette-swatch mint" data-palette="mint" title="薄荷" aria-label="薄荷配色"></button>
            <button class="palette-swatch custom" data-palette="custom" title="自定义" aria-label="自定义配色"></button>
          </div>
          <div class="custom-colors" id="customColorsPanel" hidden>
            <div class="custom-colors-heading">
              <strong>自定义颜色</strong>
              <span>配置主题颜色</span>
            </div>
            <div class="custom-colors-grid">
              <label class="custom-color-control"><span>文字</span><input type="color" data-color-var="--ink"><output data-color-value="--ink"></output></label>
              <label class="custom-color-control"><span>表面</span><input type="color" data-color-var="--paper"><output data-color-value="--paper"></output></label>
              <label class="custom-color-control"><span>边框</span><input type="color" data-color-var="--warm-gray"><output data-color-value="--warm-gray"></output></label>
              <label class="custom-color-control"><span>次要文字</span><input type="color" data-color-var="--muted"><output data-color-value="--muted"></output></label>
              <label class="custom-color-control"><span>主色</span><input type="color" data-color-var="--accent-amber"><output data-color-value="--accent-amber"></output></label>
              <label class="custom-color-control"><span>次色</span><input type="color" data-color-var="--accent-sage"><output data-color-value="--accent-sage"></output></label>
              <label class="custom-color-control"><span>危险</span><input type="color" data-color-var="--status-abandoned"><output data-color-value="--status-abandoned"></output></label>
              <label class="custom-color-control"><span>主色上的文字</span><input type="color" data-color-var="--on-accent"><output data-color-value="--on-accent"></output></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================================================================
       MAIN CONTENT AREA — open tabs (domain/mission cards)
       ================================================================ -->
  <div class="dashboard-columns" id="dashboardColumns">

    <!-- Open tabs -->
    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <div class="section-line"></div>
        <div class="section-actions" id="openTabsSectionActions"></div>
      </div>
      <div class="missions" id="openTabsMissions"></div>
    </div>

  </div><!-- end .dashboard-columns -->

  </main><!-- end .main-content -->

  <!-- ================================================================
       RIGHT SIDEBAR — Bookmarks + Todo
       ================================================================ -->
  <div class="right-sidebar">
    <!-- Bookmarks section -->
    <aside class="bookmarks-sidebar" id="bookmarksSidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">书签</div>
        <button class="sidebar-toggle" data-sidebar="bookmarks" aria-label="收起书签" aria-expanded="true">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content" id="sidebarContent"></div>
    </aside>

    <!-- Todo section -->
    <aside class="todo-sidebar collapsed" id="todoSidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">待办清单</div>
        <button class="sidebar-toggle" data-sidebar="todo" aria-label="展开待办清单" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content" id="todoSidebarContent">
        <!-- Todo form -->
        <div class="todo-form collapsed" id="todoForm">
          <button type="button" class="todo-form-trigger" data-action="toggle-todo-form" aria-expanded="false" aria-controls="todoInput todoLinkFields todoDueDate">
            <span class="todo-form-trigger-copy">
              <strong>添加待办</strong>
            </span>
            <span class="todo-form-trigger-icon" aria-hidden="true">+</span>
          </button>
          <div class="todo-input-row">
            <div class="todo-input-wrapper">
              <svg class="todo-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 002 2" />
              </svg>
              <input type="text" id="todoInput" placeholder="要做什么？" class="todo-input" autocomplete="off" aria-label="待办名称">
            </div>
          </div>
          <div class="todo-action-row">
            <div class="todo-date-wrapper">
              <input type="date" id="todoDueDate" class="todo-due-date" aria-label="截止日期" title="截止日期">
              <button type="button" class="todo-date-clear" data-action="clear-due-date" title="清除日期" aria-label="清除截止日期">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
              <svg class="todo-date-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
              <button type="button" class="todo-add-btn" data-action="add-todo" title="添加待办" aria-label="添加待办">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>
          <div class="todo-links-editor" id="todoLinksInput" aria-label="待办链接">
            <div class="todo-links-editor-heading">
              <span>链接</span>
              <button type="button" class="todo-link-add-btn" data-action="add-link-row">+ 添加链接</button>
            </div>
            <div class="todo-link-fields" id="todoLinkFields">
              <div class="todo-link-row">
                <input type="text" class="todo-link-label" placeholder="名称" aria-label="链接名称">
                <input type="url" class="todo-link-url" placeholder="https://example.com" inputmode="url" autocomplete="url" aria-label="链接地址">
                <button type="button" class="todo-link-remove-btn" data-action="remove-link-row" title="删除链接" aria-label="删除链接">×</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Active todos section -->
        <div class="todo-section active-section">
          <div class="todo-section-header">
            <h3 class="todo-section-title">待处理</h3>
            <span class="todo-section-count" id="activeTodoCount">0</span>
          </div>
          <div class="todo-list" id="activeTodoList"></div>
          <div class="todo-empty" id="activeEmpty" hidden>
            Your next step will show up here.
          </div>
        </div>
        
        <!-- Completed todos section -->
        <div class="todo-section completed-section">
          <div class="todo-section-header">
            <h3 class="todo-section-title">已完成</h3>
            <span class="todo-section-count" id="completedTodoCount">0</span>
          </div>
          <div class="todo-list" id="completedTodoList"></div>
          <div class="todo-empty" id="completedEmpty" hidden>
            Completed tasks stay here for reference.
          </div>
        </div>
        
        <!-- Stats -->
        <div class="todo-stats" id="todoStats">
          <span class="todo-active-count">0</span> 项待处理 · <span class="todo-completed-count">0</span> 项已完成
        </div>
      </div>
    </aside>
  </div>

</div><!-- end .container -->

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<!-- ================================================================
     TOAST — floats above everything, used for action confirmations
     Hidden by default via CSS (opacity:0, translateY)
     ================================================================ -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <!-- Checkmark circle icon (Heroicons outline) -->
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<!-- Personal config (gitignored) — defines LOCAL_LANDING_PAGE_PATTERNS etc. -->
<!-- If the file doesn't exist, that's fine — app.js uses sensible defaults. -->
<script src="config.local.js" id="configScript"></script>

<!-- Main dashboard logic — loads last so the DOM is ready -->
<script src="app.js"></script>
</body>
</html>
